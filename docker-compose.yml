services:
  api:
    build:
      context: ./apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    command: sh -c "php -S 0.0.0.0:8000 -t public"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: admin_system
      DB_USER: admin
      DB_PASS: admin123
      DB_CHARSET: utf8mb4
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    command: --mysql-native-password=ON --authentication-policy=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_system
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin123"]
      interval: 5s
      timeout: 3s
      retries: 20

  composer:
    image: composer:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace

volumes:
  mysql_data:
