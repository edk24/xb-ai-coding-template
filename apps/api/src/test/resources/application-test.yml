spring:
  datasource:
    url: jdbc:h2:mem:admin_api_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      # 与生产同样的脚本，只是路径改到 Flyway 迁移目录；测试用 H2，不跑 Flyway
      schema-locations: classpath:db/migration/V1__init_schema.sql
      data-locations: classpath:db/migration/V2__init_data.sql
  flyway:
    enabled: false

admin-api:
  jwt-secret: test-secret-for-integration
  upload-root: target/test-uploads
