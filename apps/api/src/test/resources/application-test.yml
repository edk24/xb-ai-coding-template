spring:
  datasource:
    # 每个 Spring 测试上下文使用独立的 H2 内存库：V3 含 ALTER TABLE，不能在同一库上重复初始化。
    # 注意：V3 的权限补种依赖 V2 的种子数据（不写死主键），因此测试里 V3 必须排在 V2 之后执行。
    url: jdbc:h2:mem:admin_api_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      # 与生产 Flyway 顺序一致：V1 建表 → V2 种子数据 → V3 安全加固（ALTER + 补权限）
      schema-locations:
        - classpath:db/migration/V1__init_schema.sql
      data-locations:
        - classpath:db/migration/V2__init_data.sql
        - classpath:db/migration/V3__security_hardening.sql
  flyway:
    enabled: false

admin-api:
  jwt-secret: test-secret-for-integration-0123456789abcdef
  upload-root: target/test-uploads
