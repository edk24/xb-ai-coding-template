spring:
  datasource:
    url: jdbc:h2:mem:admin_api_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

admin-api:
  jwt-secret: test-secret-for-integration
  upload-root: target/test-uploads
